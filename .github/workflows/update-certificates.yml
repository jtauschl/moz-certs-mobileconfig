name: Update Mozilla Root Certificates

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regeneration even if SHA unchanged'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Full history + tags so we can resolve the latest v* release tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve latest v* tag
        id: basetag
        run: |
          # Highest semantic-version tag (v1.2.0 > v1.1.0 > ...). Releases are
          # built from this tagged commit only, never from an untagged main HEAD.
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [[ -z "$TAG" ]]; then
            echo "::error::No v* tag found – nothing to build a release from."
            exit 1
          fi
          # Resolve to a commit SHA: `gh release create --target` accepts a
          # branch or SHA, but not a tag name.
          SHA=$(git rev-list -n1 "$TAG")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Building from tag: ${TAG} (${SHA})"
          git checkout --quiet "$TAG"

      - name: Fetch remote SHA-256
        id: remote
        run: |
          SHA=$(curl -fsSL --max-time 10 https://curl.se/ca/cacert.pem.sha256 | awk '{print $1}')
          if [[ ! "$SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid remote SHA-256: '$SHA'"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Remote SHA-256: ${SHA:0:16}..."

      - name: Check latest release SHA
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh release view --json body -q '.body' 2>/dev/null || echo "")
          PREV=$(echo "$BODY" | grep -o 'sha256:[a-f0-9]\{64\}' | head -1 | sed 's/sha256://' || echo "")
          echo "prev_sha=${PREV}" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.remote.outputs.sha }}" == "$PREV" && "${{ inputs.force }}" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date - skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New CA bundle detected - generating profile."
          fi

      - name: Generate mobileconfig
        if: steps.check.outputs.changed == 'true'
        run: bash generate.sh

      - name: Create release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.remote.outputs.sha }}"
          DATE=$(date -u +%Y-%m-%d)
          TAG="certs-${DATE}"

          # On a manual force run on the same day, avoid colliding with an
          # existing tag/release by using a unique, race-free suffix.
          if [[ "${{ inputs.force }}" == "true" ]] && gh release view "$TAG" >/dev/null 2>&1; then
            TAG="certs-${DATE}-r${GITHUB_RUN_NUMBER}"
          fi

          printf '%s\n' \
            "Automated update of Mozilla Root Certificates from [curl.se/ca](https://curl.se/ca/)." \
            "" \
            "**SHA-256:** sha256:${SHA}" \
            "" \
            "---" \
            "" \
            "**Install on macOS:** Open the file, then System Settings > Privacy & Security > Profiles" \
            "" \
            "**Install on iOS:** Open in Safari, then Settings > General > VPN & Device Management" \
            > release-notes.md

          # Anchor the certs-* tag on the v* tagged commit we built from,
          # not on the default branch HEAD.
          gh release create "$TAG" \
            dist/moz-certs.mobileconfig \
            --target "${{ steps.basetag.outputs.commit }}" \
            --title "Mozilla Root Certificates - ${DATE}" \
            --notes-file release-notes.md \
            --latest
